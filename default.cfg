; Storage Guard — defaults (used by Unraid update.php when Default is pressed)
; Live settings: /boot/config/plugins/StorageGuard/StorageGuard.cfg
;
; Product defaults (machine-aware via plugins/StorageGuard/sg-update.php on Default):
;   With array data disks:
;     Array Warning = largest data disk; Array Critical = smallest data disk
;     Array free-bar coloring = Yes; Alerts = Array Warning + Array Critical
;   Pools-only / no array:
;     Array coloring/alerts off (Array section auto-hidden; Show Array to edit)
;   Pools / cache:
;     Pool free-bar coloring = Yes (all pools); pool alerts off
;     Cache/pool threshold UI hidden by default (Show Cache remembers)
;   Appearance: Outline style; green outline when OK; pulse off (opt-in)
;   Empty pool thresholds = None (no auto capacity-fit paint)
;
; Static keys below are a baseline; sg-update.php overrides array_* / alerts_array_*
; from live disks.ini. Dynamic pool_* / alerts_pool_* keys cannot live here.

sg_defaults=""
array_coloring="yes"
pool_coloring="yes"
array_color_style="outline"
outline_pulse="no"
outline_show_ok="yes"
array_warning=""
array_critical=""
array_use_custom="no"
array_warning_custom=""
array_critical_custom=""
pools_to_color="all"
alerts_array_warning="yes"
alerts_array_critical="yes"
btrfs_hints_enabled="yes"
