; Storage Guard — defaults (used by Unraid update.php when Default is pressed)
; Live settings: /boot/config/plugins/StorageGuard/StorageGuard.cfg
;
; Product defaults (machine-aware via plugins/StorageGuard/sg-update.php on Default):
;   With array data disks:
;     Array Warning = largest data disk; Array Critical = None
;     Array free-bar coloring = Yes; Alerts = Array Warning only
;   Pools-only / no array (cache pools, boot only, mdNumDisks=0):
;     Array Warning/Critical = None; Array coloring = No; Array alerts = off
;     (Settings UI hides Array section — Show hidden items… to edit inactive values)
;   Always: Pool free-bar coloring = No; pool thresholds/alerts None/off
;
; Static keys below are a baseline; sg-update.php overrides array_* / alerts_array_*
; from live disks.ini. Dynamic pool_* / alerts_pool_* keys cannot live here.

sg_defaults=""
array_coloring="yes"
pool_coloring="no"
array_color_style="outline"
outline_pulse="no"
outline_show_ok="no"
array_warning=""
array_critical=""
array_use_custom="no"
array_warning_custom=""
array_critical_custom=""
pools_to_color="all"
alerts_array_warning="yes"
alerts_array_critical="no"
btrfs_hints_enabled="yes"
