; Storage Guard defaults (Default button / first install baseline).
; Live: /boot/config/plugins/StorageGuard/StorageGuard.cfg
; Install runs sg_seed_product_cfg() to autofill disk sizes from disks.ini.
; Yes/No product defaults lean Yes; pulse stays No; green outline when OK.

sg_defaults=""
array_coloring="yes"
pool_coloring="yes"
array_color_style="outline"
outline_pulse="no"
outline_show_ok="yes"
array_warning=""
array_critical=""
array_use_custom="no"
array_warning_custom=""
array_critical_custom=""
pools_to_color="all"
alerts_array_warning="yes"
alerts_array_critical="yes"
btrfs_hints_enabled="yes"
